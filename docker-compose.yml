services:
  web:
    build: .
    container_name: asvs-self-assessment-web
    ports:
      - "8000:8000"
    environment:
      - ASVS_DB_URL=sqlite:///./asvs.db
      - ZAP_BASE_URL=http://zap:8080
      - ZAP_ALLOWED_HOSTS=localhost,127.0.0.1,host.docker.internal,vulnerable-app,web
    volumes:
      - .:/workspace
    depends_on:
      - zap

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: asvs-owasp-zap
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

